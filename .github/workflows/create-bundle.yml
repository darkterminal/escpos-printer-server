name: Build & Release Bundle

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RELEASE_DIR: eps-windows-bundle
      NSSM_URL: https://nssm.cc/release/nssm-2.24.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Setup PHP environment ---
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, sockets, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # --- Install Box for PHAR builds ---
      - name: Install Box
        run: composer global require humbug/box:^4.7 --no-interaction

      # --- Build PHAR ---
      # The build installs dev dependencies and must succeed for the release to proceed.
      - name: Build PHAR
        run: |
          composer install --no-interaction
          composer run create:phar

      # --- Verify bundled assets ---
      - name: Verify PHAR assets
        run: |
          php -r '$p=new Phar("bin/eps.phar"); foreach(["config/settings.html","config/printer-settings.json"] as $f){if(!isset($p[$f])){fwrite(STDERR,"missing $f\n");exit(1);}} echo "phar assets ok\n";'

      # --- Prepare release directory ---
      - name: Prepare release directory
        run: |
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

      # --- Download and include NSSM ---
      - name: Download and extract NSSM
        run: |
          curl -L -o /tmp/nssm.zip "$NSSM_URL"
          unzip -q /tmp/nssm.zip -d /tmp/nssm_unpack
          find /tmp/nssm_unpack -type f -iname "nssm.exe" -exec cp {} "$RELEASE_DIR/" \;

      # --- Resolve PHP 8.4 Windows build from release metadata ---
      - name: Resolve PHP 8.4 Windows build
        id: php
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "ERROR: jq is required to resolve PHP release metadata" >&2
            exit 1
          fi
          PHP_META="$(curl -fsSL --retry 3 --max-time 30 https://windows.php.net/downloads/releases/releases.json)" \
            || { echo "ERROR: failed to fetch PHP release metadata from releases.json" >&2; exit 1; }
          PHP_ZIP="$(printf '%s' "$PHP_META" | jq -er '.["8.4"]["ts-vs17-x64"].zip.path')" \
            || { echo "ERROR: failed to extract PHP 8.4 ts-vs17-x64 zip path from releases.json" >&2; exit 1; }
          PHP_SHA256="$(printf '%s' "$PHP_META" | jq -er '.["8.4"]["ts-vs17-x64"].zip.sha256')" \
            || { echo "ERROR: failed to extract PHP 8.4 ts-vs17-x64 zip sha256 from releases.json" >&2; exit 1; }
          if ! [[ "$PHP_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: invalid PHP zip sha256 from releases.json: $PHP_SHA256" >&2
            exit 1
          fi
          echo "php_zip=$PHP_ZIP" >> "$GITHUB_OUTPUT"
          echo "php_sha256=$PHP_SHA256" >> "$GITHUB_OUTPUT"

      # --- Download & unpack PHP for Windows ---
      - name: Download and unpack PHP (Windows build)
        run: |
          curl -fsSL --retry 3 -o /tmp/php.zip "https://windows.php.net/downloads/releases/${{ steps.php.outputs.php_zip }}"
          echo "${{ steps.php.outputs.php_sha256 }}  /tmp/php.zip" | sha256sum -c -
          unzip -q /tmp/php.zip -d /tmp/php_unpack
          mkdir -p "$RELEASE_DIR/php"
          cp -r /tmp/php_unpack/* "$RELEASE_DIR/php/"
          cp "$RELEASE_DIR/php/php.ini-production" "$RELEASE_DIR/php/php.ini"
          {
            echo "extension=intl"
            echo "extension=sockets"
            echo "extension=openssl"
            echo "extension_dir=ext"
          } >> "$RELEASE_DIR/php/php.ini"

      # --- Restore runtime-only dependencies after the dev-enabled PHAR build ---
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader

      # --- Copy project files into bundle ---
      - name: Copy application files
        run: |
          # Copy top-level config and src directories into the bundle root (avoid nested/duplicate dirs)
          cp -r config "$RELEASE_DIR/"
          cp -r src "$RELEASE_DIR/"
          cp composer.json "$RELEASE_DIR/composer.json"
          cp composer.lock "$RELEASE_DIR/composer.lock"
          cp eps "$RELEASE_DIR/eps"
          # Copy PHAR only if present (built above); avoid failing the job if missing
          if [ -f bin/eps.phar ]; then
            cp bin/eps.phar "$RELEASE_DIR/eps.phar"
          else
            echo "Warning: bin/eps.phar not found; PHAR bundle will be empty"
          fi
          cp scripts/eps-install.bat "$RELEASE_DIR/eps-install.bat"
          cp scripts/eps-uninstall.bat "$RELEASE_DIR/eps-uninstall.bat"
          cp -r vendor "$RELEASE_DIR/vendor"

      # --- Verify the bundle layout before compressing it ---
      - name: Verify Windows bundle layout
        run: bash scripts/verify-bundle.sh "$RELEASE_DIR"

      # --- Generate ZIP filenames ---
      - name: Define ZIP filenames
        id: names
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-manual}"
          DATE=$(date +%Y%m%d)
          ZIP_WINDOWS="eps-windows-bundle-${TAG_NAME}-${DATE}.zip"
          ZIP_PHAR="eps-unix-bundle-${TAG_NAME}-${DATE}.zip"
          echo "zip_windows=$ZIP_WINDOWS" >> $GITHUB_OUTPUT
          echo "zip_phar=$ZIP_PHAR" >> $GITHUB_OUTPUT

      # --- Compress Windows bundle ---
      - name: Create Windows ZIP bundle
        run: |
          cd "$RELEASE_DIR"
          zip -r9 "../${{ steps.names.outputs.zip_windows }}" .
          cd ..

      # --- Compress standalone PHAR ---
      - name: Create standalone PHAR ZIP
        run: |
          mkdir -p dist
          cp bin/eps.phar dist/
          cd dist
          zip -r9 "../${{ steps.names.outputs.zip_phar }}" eps.phar
          cd ..

      # --- Upload artifacts for manual runs without touching a release ---
      - name: Upload bundle ZIPs as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: eps-bundles
          path: |
            ${{ steps.names.outputs.zip_windows }}
            ${{ steps.names.outputs.zip_phar }}

      # --- Upload artifacts to GitHub Release ---
      - name: Upload ZIP files to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.names.outputs.zip_windows }}
            ${{ steps.names.outputs.zip_phar }}
