<aside class="sidebar" data-sidebar>
    {% assign sections = site.data.nav | group_by: "section" %}
    {% for section in sections %}
    <div class="sidebar__section">
        <p class="sidebar__title">{{ section.name }}</p>
        <ul class="sidebar__list">
            {% for item in section.items %}
            <li>
                <a class="sidebar__link" href="{{ item.url | relative_url }}"
                   {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
            </li>
            {% endfor %}
        </ul>
    </div>
    {% endfor %}

    <div class="sidebar__cta">
        <p>Printing receipts from PHP? The WebSocket server is one install away.</p>
        <a href="https://github.com/darkterminal/escpos-printer-server">Get the source →</a>
    </div>
</aside>
